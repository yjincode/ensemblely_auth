plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.4'
    id 'jacoco'
}

group = 'spring'
version = '0.0.1-SNAPSHOT'
description = 'auth-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'  // 소셜 로그인 (추후 업데이트 예정)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'  // 이메일 템플릿 엔진
    implementation 'org.springframework.boot:spring-boot-starter-mail'  // 이메일 발송
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'  // 인증 코드 저장
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // gRPC (User 정보 조회용 서버)
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
    implementation 'io.grpc:grpc-stub:1.62.2'
    implementation 'io.grpc:grpc-protobuf:1.62.2'
    implementation 'com.google.protobuf:protobuf-java:3.25.3'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // Reactive gRPC (Gateway 호환용)
    implementation 'com.salesforce.servicelibs:reactor-grpc-stub:1.2.4'

    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.grpc:grpc-testing:1.62.2'
    testImplementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    ignoreFailures = true
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = true
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                // ===== 제외: 비즈니스 로직이 없는 클래스들 =====

                // Configuration & Application
                '**/config/**',
                '**/*Application.class',

                // Domain Layer (Entity, DTO, Enum - 로직 없음)
                '**/domain/vo/**',
                '**/domain/model/**',

                // Repository 인터페이스 (Spring Data JPA 자동 구현)
                '**/adapter/out/persistence/*Repository.class',

                // Utilities (선택적 제외)
                '**/util/**',

                // Scheduler (배치 작업 - 선택적 제외)
                '**/scheduler/**',

                // Proto 자동 생성 파일
                '**/UserInfoServiceGrpc*.class',
                '**/UserIdRequest*.class',
                '**/UserIdsRequest*.class',
                '**/UserNicknameResponse*.class',
                '**/UserNicknamesResponse*.class',
                '**/UserMaxWorkspacesResponse*.class',
                '**/UserDisplayInfoResponse*.class',
                '**/UserInfoProto*.class',

                // Port 인터페이스 (인터페이스는 테스트 불필요)
                '**/application/port/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                // 핵심 비즈니스 로직 (Controller, Service, Adapter) 17% 커버리지
                // Proto 자동 생성 파일 제외 시 실제 커버리지는 더 높음
                minimum = 0.17
            }
        }
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                // ===== 제외: 비즈니스 로직이 없는 클래스들 =====

                // Configuration & Application
                '**/config/**',
                '**/*Application.class',

                // Domain Layer (Entity, DTO, Enum - 로직 없음)
                '**/domain/vo/**',
                '**/domain/model/**',

                // Repository 인터페이스 (Spring Data JPA 자동 구현)
                '**/adapter/out/persistence/*Repository.class',

                // Utilities (선택적 제외)
                '**/util/**',

                // Scheduler (배치 작업 - 선택적 제외)
                '**/scheduler/**',

                // Proto 자동 생성 파일
                '**/UserInfoServiceGrpc*.class',
                '**/UserIdRequest*.class',
                '**/UserIdsRequest*.class',
                '**/UserNicknameResponse*.class',
                '**/UserNicknamesResponse*.class',
                '**/UserMaxWorkspacesResponse*.class',
                '**/UserDisplayInfoResponse*.class',
                '**/UserInfoProto*.class',

                // Port 인터페이스 (인터페이스는 테스트 불필요)
                '**/application/port/**'
            ])
        }))
    }
}

// protobuf 설정
protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.3'
    }
    plugins {
        grpc {
            artifact = 'io.grpc:protoc-gen-grpc-java:1.62.2'
        }
        reactor {
            artifact = 'com.salesforce.servicelibs:reactor-grpc:1.2.4'
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
            reactor {}
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs 'build/generated/source/proto/main/grpc'
            srcDirs 'build/generated/source/proto/main/java'
            srcDirs 'build/generated/source/proto/main/reactor'
        }
    }
}
